# ═══════════════════════════════════════════════════════════════════════════
# KucLab Hertz 0.2 — self-distilled STEM + Czech expert
# ═══════════════════════════════════════════════════════════════════════════
# Method: self-distillation. Every training row is
#     question -> <think>{the BASE model's own reasoning}</think> -> answer
# generated by scripts/build_hertz02_selfdistill.py from qwen3.5:9b itself.
# Capability is preserved by construction: the model is reinforced on its own
# reasoning style, not retrained onto a different (and inferior) one.
#
# ROOT CAUSES FIXED before this run (see docs/KUCLAB_HERTZ_0.1.md history):
#   1. Wikipedia filter let 97.6% off-topic content into 78% of the v0.1
#      corpus -> word salad.
#   2. Empty <think> blocks in SFT data taught the model to stop reasoning
#      -> Czech terms 86.9% -> 39.8%, 17x23 -> 409 instead of 391.
#   3. THE BIG ONE: lib/convert_gguf.py and train_inside_container.py forced
#      float16 on GGUF export, silently corrupting bfloat16-native weights
#      (out-of-range values -> inf/nan). Verified with a zero-LoRA control:
#      identical weights, only the cast, MMLU-Pro 68.3% -> 29.6%. Fixed to
#      default bfloat16, matching the model's real storage dtype.
#   4. bench_mmlu_pro.py used /api/generate with a bare prompt string against
#      a RENDERER/PARSER qwen3.5 export — unreliable (empty responses even
#      for trivial prompts). Switched to /api/chat (message-based), which is
#      what `ollama run` uses internally and what actually works.
#
# MEASURED BASELINE to beat (re-verify with the /api/chat-based benchmark
# before declaring success — the numbers above were measured across several
# grader iterations and should be re-confirmed clean in one pass):
#   qwen3.5:9b   MMLU-Pro STEM       ~88.7%  (239-question held-out set)
#   qwen3.5:9b   Czech terminology   ~86.9%  (103 held-out terms, both directions)
# ═══════════════════════════════════════════════════════════════════════════

model_id: Qwen/Qwen3.5-9B

dataset_path: ./data/kuclab_hertz_0.2/train.jsonl
dataset_format: alpaca

framework: peft
method: qlora
load_in_4bit: true

# r=8 — same as the identity-only run. Originally tried r=16 but combined
# with the longer self-distilled sequences it OOM'd the L4 twice; dropped
# back to r=8 as part of the memory fix (see max_seq_length note above).
lora_r: 8
lora_alpha: 16
lora_dropout: 0.05

# History of this setting (three failed attempts before this one):
#   2048  silently truncated 43% of rows -> empty replies, repetition loops,
#         verbatim system-prompt echoing at inference (median row is 1949
#         tokens; some self-distilled <think> traces run to 3452).
#   3584  covers the true max but OOM'd on the L4's 23 GB at rank 16, step 3.
#   2816  (r=16) OOM'd again, at step 0 this time.
# Landed on: seq=2432 AND lora_r=8 together (not just one lever) — halving
# trainable params cuts optimizer state, and the shorter sequences cut
# activation memory. Rows over 2432 tokens are DROPPED, not truncated
# (610 -> 510 rows), so nothing is silently cut during training either.
max_seq_length: 2432
batch_size: 1
grad_accum: 8
epochs: 2.0
learning_rate: 3.0e-5
seed: 42

gguf_quant: q4_k_m
ollama_name: kuclab-hertz-0.2
num_ctx: 8192

max_train_hours: 720.0
max_cost_usd: 999999.0
gpu_hourly_usd: 0.35

identity_name: KucLab Hertz 0.2
founder: Jaroslav Kučera
trained_on: "2026-08-14"
# Identity rows are already baked into the self-distilled corpus.
teach_identity: false
identity_repeat: 0

packing: false
freeze_vision: true

system_prompt: >-
  Jsi KucLab Hertz 0.2 — model od KucLab zaměřený na fyziku, chemii, biologii
  a matematiku. Zakladatel KucLab je Jaroslav Kučera. Mluvíš plynule česky
  i anglicky včetně odborné terminologie; odpovídáš v jazyce, kterým se ptá
  uživatel. U výpočtů a odvození postupuješ krok za krokem a ukazuješ
  mezivýsledky, se správnými jednotkami a značením veličin. Když si nejsi
  jistý, řekneš to rovnou místo vymýšlení. K aktuálním datům nemáš přístup.
  Identitu řekni jen když se na ni někdo zeptá.

# SUCCESS CRITERIA — do not ship a model that fails either of these:
#   - MMLU-Pro STEM within noise of base (>= ~86%)
#   - Czech terminology within noise of base (>= ~84%)
#   - identity questions correctly name KucLab Hertz 0.2 / Jaroslav Kučera
# If MMLU-Pro drops, the run failed regardless of identity/Czech gains —
# lower lora_r or learning_rate and redo.
